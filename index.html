```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AIの手を当てろ！将棋</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f3f0e8;
        color: #222;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            "Noto Sans JP",
            sans-serif;
        text-align: center;
    }

    h1 {
        margin: 20px 0 8px;
        font-size: 28px;
    }

    #status {
        min-height: 32px;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 12px;
    }

    #info {
        margin-bottom: 15px;
        font-size: 15px;
    }

    #game {
        display: inline-block;
    }

    #board-area {
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    #board {
        width: min(90vw, 540px);
        height: min(90vw, 540px);
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        grid-template-rows: repeat(9, 1fr);
        border: 3px solid #5a3d20;
        background: #d9a85b;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .cell {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        border-right: 1px solid #8d642e;
        border-bottom: 1px solid #8d642e;
        background: #e4b96e;
        cursor: pointer;
        user-select: none;
    }

    .cell:nth-child(9n) {
        border-right: none;
    }

    .cell:nth-last-child(-n+9) {
        border-bottom: none;
    }

    .cell.selected {
        background: #f4dc72;
    }

    .cell.target {
        background: #d8ef9d;
    }

    .cell.last {
        background: #f0cf8b;
    }

    .piece {
        width: 78%;
        height: 82%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: clamp(24px, 5vw, 40px);
        font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
        font-weight: bold;
        line-height: 1;
        transform: rotate(180deg);
    }

    .piece.gote {
        transform: rotate(0deg);
    }

    .piece.promoted {
        color: #b40000;
    }

    #buttons {
        margin-top: 18px;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        margin: 4px;
        background: #444;
        color: white;
        font-size: 15px;
        cursor: pointer;
    }

    button:hover {
        background: #222;
    }

    #score {
        margin-top: 12px;
        font-size: 20px;
        font-weight: bold;
    }

    #message {
        margin-top: 10px;
        min-height: 25px;
        font-size: 16px;
    }

    .good {
        color: #167c35;
    }

    .bad {
        color: #c21d1d;
    }

    .sub {
        color: #666;
        font-size: 13px;
    }
</style>
</head>

<body>

<h1>AIの手を当てろ！将棋</h1>

<div id="status">問題を読み込んでいます……</div>

<div id="info">
    AIと同じ手を指せ！<br>
    <span class="sub">1手でも違ったらゲームオーバー。2手正解で次の問題。</span>
</di
```
