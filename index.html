<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>死にゲー将棋 - 3手連続ロードナイトメア</title>
  <script src="https://cdn.jsdelivr.net/npm/kifu-for-js@3/bundle/kifu-for-js.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background-color: #111; color: #fff; margin: 0; padding: 20px; }
    #board { display: inline-block; margin-top: 15px; }
    #status { font-size: 1.3rem; font-weight: bold; margin: 15px 0; min-height: 1.5em; }
    .died { color: #ff4444; font-size: 2rem; }
    .safe { color: #44ff44; }
    .stage-counter { font-size: 0.9rem; color: #888; margin-top: 5px; }
    .controls { margin-top: 15px; }
    button { padding: 10px 20px; font-size: 1rem; cursor: pointer; background: #222; color: #fff; border: 1px solid #555; border-radius: 4px; }
    button:hover { background: #444; }
  </style>
</head>
<body>
  <h1 id="stage-title">3手死にゲー将棋</h1>
  <div class="stage-counter" id="clear-count">CLEAR STREAK: 0</div>
  
  <div id="status">データ読み込み中...</div>
  
  <div id="board"></div>

  <div class="controls">
    <button onclick="skipStage()">スキップ（次の3手へ）</button>
  </div>

  <script>
    let kifuDatabase = [];
    let currentRoute = []; // 正解の手順配列（例: ["+2726FU", "-8384FU", "+2625FU"]）
    let currentStep = 0;
    let kifuPlayer = null;
    let lastMoveCount = 1;
    let clearStreak = 0;

    // 1. stages.json を読み込む処理
    async function loadStages() {
      try {
        console.log("stages.json の取得を開始します...");
        const response = await fetch('stages.json');
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        kifuDatabase = await response.json();
        console.log(`ステージを ${kifuDatabase.length} 件読み込みました`);

        next3MoveStage();
      } catch (error) {
        console.error('stages.json の読み込みに失敗しました:', error);
        document.getElementById("status").innerText = "stages.json の読み込みに失敗しました";
      }
    }

    window.addEventListener('load', loadStages);

    // 2. CSA記法の配列から KifuForJS が読める正式な CSAテキストを生成する
    function convertToCsaText(moves) {
      const header = [
        "V2.1",
        "P1-KY-KE-GI-KI-OU-KI-GI-KE-KY",
        "P2 * -HI * * * * * -KA *",
        "P3-FU-FU-FU-FU-FU-FU-FU-FU-FU",
        "P4 * * * * * * * * *",
        "P5 * * * * * * * * *",
        "P6 * * * * * * * * *",
        "P7+FU+FU+FU+FU+FU+FU+FU+FU+FU",
        "P8 * +KA * * * * * +HI *",
        "P9+KY+KE+GI+KI+OU+KI+GI-KE-KY", // 平手初期配置
        "+"
      ];

      // 純粋な指し手のみ抽出（単体の "+" などを除外）
      const cleanMoves = moves.filter(m => m !== "+");
      return header.join("\n") + "\n" + cleanMoves.join("\n");
    }

    // 3. 次の3手ステージへ進む処理
    function next3MoveStage() {
      if (!kifuDatabase || kifuDatabase.length === 0) return;

      currentStep = 0;
      lastMoveCount = 1;

      // ランダムに1つのデータを選択し、単体の "+" を除外して正解配列にする
      const rawStage = kifuDatabase[Math.floor(Math.random() * kifuDatabase.length)];
      currentRoute = rawStage.filter(m => m !== "+");

      console.log('今回の出題手順:', currentRoute);

      document.getElementById("stage-title").innerText = `3手ステージ`;
      document.getElementById("status").innerHTML = "AIの3手を当てろ...！";

      // 盤面クリア＆CSA形式でロード
      document.getElementById("board").innerHTML = "";
      const csaText = convertToCsaText(currentRoute);

      KifuForJS.loadString(csaText, "board").then(function(player) {
        console.log("KifuForJS の読み込み成功");
        kifuPlayer = player;

        if (player.setFreeMode) player.setFreeMode(true);

        if (typeof player.onChange === "function") {
          player.onChange(() => checkMove());
        } else if (player.store && typeof player.store.subscribe === "function") {
          player.store.subscribe(() => checkMove());
        }
      }).catch(err => {
        console.error("KifuForJS エラー:", err);
        document.getElementById("status").innerText = "盤面ライブラリの読み込みに失敗しました";
      });
    }

    // 4. KifuForJS の指し手オブジェクトから CSA 文字列（例: "+2726FU"）に変換する
    function getCsaFromMove(moveObj) {
      if (!moveObj || !moveObj.move) return "";
      const m = moveObj.move;
      const color = moveObj.color === 0 ? "+" : "-";
      const fromStr = m.from ? `${m.from.x}${m.from.y}` : "00";
      const toStr = m.to ? `${m.to.x}${m.to.y}` : "00";
      const piece = m.piece || "";
      return `${color}${fromStr}${toStr}${piece}`;
    }

    // 5. 手順判定処理
    function checkMove() {
      if (!kifuPlayer || !kifuPlayer.store) return;

      const store = kifuPlayer.store;
      const kifu = store.player ? store.player.kifu : store.kifu;
      if (!kifu || !kifu.moves) return;

      const moves = kifu.moves;
      if (moves.length <= lastMoveCount) return;

      lastMoveCount = moves.length;
      const lastMove = moves[moves.length - 1];

      // 指された手を CSA 記法に変換（例: "+2726FU"）
      const playedCsa = getCsaFromMove(lastMove);
      const playedMoveStr = lastMove && lastMove.move ? (lastMove.move.str || "") : "";
      const expectedMove = currentRoute[currentStep];

      console.log("指した手:", playedCsa, `(${playedMoveStr})`, "正解:", expectedMove);

      // 完全一致（または文字列包含）で正誤判定
      if (expectedMove && (playedCsa === expectedMove || playedMoveStr.includes(expectedMove))) {
        // ---【正解】---
        currentStep++;

        if (currentStep >= currentRoute.length) {
          clearStreak++;
          document.getElementById("clear-count").innerText = `CLEAR STREAK: ${clearStreak}`;
          document.getElementById("status").innerHTML = "<span class='safe'>STAGE CLEAR !! 次の3手へ...</span>";
          
          setTimeout(() => {
            next3MoveStage();
          }, 800);
        } else {
          document.getElementById("status").innerHTML = `<span class='safe'>HIT ! (${currentStep}/${currentRoute.length} 手目クリア)</span>`;
        }
      } else {
        // ---【不正解（即死）】---
        clearStreak = 0;
        document.getElementById("clear-count").innerText = `CLEAR STREAK: 0`;
        document.getElementById("status").innerHTML = "<span class='died'>YOU DIED !!</span>";

        setTimeout(() => {
          alert(`YOU DIED !!\n正解は「${expectedMove || 'なし'}」でした。\nリトライ！`);
          currentStep = 0;
          lastMoveCount = 1;
          document.getElementById("status").innerHTML = "AIの3手を当てろ...！";
          
          // 初期化リトライ
          if (kifuPlayer && typeof kifuPlayer.goto === "function") {
            kifuPlayer.goto(0);
          } else {
            next3MoveStage();
          }
        }, 50);
      }
    }

    function skipStage() {
      next3MoveStage();
    }
  </script>
</body>
</html>
